<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <h1>AYAM BOLO BEBEK SIDOARJO</h1>
        <h2>RESERVASI MEJA MAKAN</h2>
        <div class="card">
            <form class="form" onsubmit="return validasiNama()">
                <div class="form-control">
                    <label for="nama" class="label">Nama</label>
                    <input class="input" type="text" name="nama" id="nama" required>
                </div>

                <div class="form-control">
                    <label for="tanggal" class="label">Tanggal</label>
                    <input class="input" type="date" name="tanggal" required>
                </div>

                <div class="form-control">
                    <label class="label">Pilih Meja</label>
                    <Select class="input" required>
                        <option value="" hidden></option>
                        <option value="meja1">Meja 1(4 Orang)</option>
                        <option value="meja2">Meja 2(4 Orang)</option>
                        <option value="meja3">Meja 3(6 Orang)</option>
                        <option value="meja4">Meja 4(8 Orang)</option>
                    </Select>
                </div>

                <div class="form-control">
                    <label class="label">Durasi</label>
                    <Select class="input" required>
                        <option value="" hidden></option>
                        <option value="durasi1">1 Jam</option>
                        <option value="durasi2">2 Jam</option>
                        <option value="durasi3">3 Jam</option>
                    </Select>
                </div>
                <div class="form-control">
                    <input type="submit" value="Kirim" class="btn-submit">
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
